name: Build and Deploy to Aliyun

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create deployment package
        run: |
          cd .next
          tar -czf ../build-package.tar.gz .
          cd ..
          ls -lh build-package.tar.gz

      - name: Upload build package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "build-package.tar.gz"
          target: "/root/sifan/"
          strip_components: 0

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            echo "开始部署..."

            cd /root/sifan || exit 1

            # 备份当前构建
            if [ -d ".next" ]; then
                echo "备份当前构建..."
                mv .next .next.backup.$(date +%Y%m%d_%H%M%S)
            fi

            # 创建 .next 目录
            echo "创建 .next 目录..."
            mkdir -p .next

            # 解压新构建
            echo "解压新构建..."
            tar -xzf build-package.tar.gz -C .next

            # 重启服务（如果进程不存在则启动）
            echo "重启服务..."
            if pm2 describe enterprise-website > /dev/null 2>&; then
                pm2 restart enterprise-website
                echo "✓ 服务已重启"
            else
                echo "服务不存在，正在启动..."
                pm2 start ecosystem.config.js
                echo "✓ 服务已启动"
            fi

            # 保存 PM2 配置
            pm2 save

            # 清理
            rm -f build-package.tar.gz

            echo "✓ 部署完成！"